# OpenVPN client template
# Замените <server-ip> и <server-cert-name> на реальные значения

client
proto tcp-client
remote <server-ip> 443
dev tun
resolv-retry infinite
nobind
persist-key
persist-tun
remote-cert-tls server
verify-x509-name <server-cert-name> name
auth SHA256
auth-nocache
cipher AES-128-GCM
tls-client
tls-version-min 1.2
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256

verb 3

# Секретные блоки (хранить отдельно):
# <ca>...</ca>
# <cert>...</cert>
# <key>...</key>
# <tls-crypt>...</tls-crypt>
