client
proto tcp-client
remote <wsl-gateway-ip> 8443
dev tun
resolv-retry infinite
nobind
persist-key
persist-tun
remote-cert-tls server
verify-x509-name <server-cert-name> name
auth SHA256
auth-nocache
cipher AES-128-GCM
tls-client
tls-version-min 1.2
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256

# Важно: путь до Windows gateway не должен уходить в VPN
route <wsl-gateway-ip> 255.255.255.255 net_gateway

verb 3

# Ниже в реальном файле идут секретные блоки:
# <ca>...</ca>
# <cert>...</cert>
# <key>...</key>
# <tls-crypt>...</tls-crypt>
