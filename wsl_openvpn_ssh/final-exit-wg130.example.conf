# WireGuard on final exit-server (130)
# Receives traffic from exit-server (194) via wg130

[Interface]
PrivateKey = <WG_PRIVATE_KEY>
Address = 10.0.3.1/24
ListenPort = 51821

PostUp = iptables -A FORWARD -i %i -o eth0 -j ACCEPT
PostUp = iptables -A FORWARD -i eth0 -o %i -m state --state RELATED,ESTABLISHED -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -s 10.0.3.0/24 -o eth0 -j MASQUERADE

PostDown = iptables -D FORWARD -i %i -o eth0 -j ACCEPT
PostDown = iptables -D FORWARD -i eth0 -o %i -m state --state RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s 10.0.3.0/24 -o eth0 -j MASQUERADE

[Peer]
PublicKey = <EXIT_SERVER_WG_PUBLIC_KEY>
AllowedIPs = 10.0.3.2/32
