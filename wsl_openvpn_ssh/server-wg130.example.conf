# WireGuard on exit-server: routes VPN client traffic to final exit (130)
# Policy routing: 10.8.0.0/24 from tun0 → table 200 → wg130
# Exception: 10.8.0.10 (direct profile) → main table → eth0

[Interface]
PrivateKey = <WG_PRIVATE_KEY>
Address = 10.0.3.2/24
Table = off

# Policy routing + firewall
PostUp = ip rule add from 10.8.0.10 iif tun0 lookup main priority 50
PostUp = ip rule add from 10.8.0.0/24 iif tun0 table 200 priority 100
PostUp = ip route add default dev wg130 table 200
PostUp = iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o wg130 -j MASQUERADE
PostUp = iptables -A FORWARD -i tun0 -o wg130 -j ACCEPT
PostUp = iptables -A FORWARD -i wg130 -o tun0 -m state --state RELATED,ESTABLISHED -j ACCEPT

PostDown = ip rule del from 10.8.0.10 iif tun0 lookup main priority 50 || true
PostDown = ip rule del from 10.8.0.0/24 iif tun0 table 200 priority 100 || true
PostDown = ip route del default dev wg130 table 200 || true
PostDown = iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o wg130 -j MASQUERADE || true
PostDown = iptables -D FORWARD -i tun0 -o wg130 -j ACCEPT || true
PostDown = iptables -D FORWARD -i wg130 -o tun0 -m state --state RELATED,ESTABLISHED -j ACCEPT || true

[Peer]
PublicKey = <FINAL_EXIT_WG_PUBLIC_KEY>
AllowedIPs = 0.0.0.0/0
Endpoint = <final-exit-ip>:51821
PersistentKeepalive = 25
